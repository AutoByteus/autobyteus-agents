<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" role="img" aria-labelledby="title desc">
  <title id="title">Software Engineering Agent Team as a Directed Workflow Graph</title>
  <desc id="desc">A directed graph showing six software engineering agents and conditional handoff edges from solution design through delivery, including rework loops and blocked outcomes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2415d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16826a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .node-title { font: 700 21px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-subtitle { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #334155; text-anchor: middle; }
      .edge-label { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #334155; text-anchor: middle; }
      .edge-label-red { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #a2344b; text-anchor: middle; }
      .edge-label-green { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #12664f; text-anchor: middle; }
      .legend { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="2000" height="1300" fill="#f8fafc"/>
  <rect x="34" y="34" width="1932" height="1232" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="100" y="105" class="title">Software Engineering Agent Team</text>
  <text x="100" y="143" class="subtitle">A directed workflow graph: nodes own stages, edges carry conditional handoff contracts.</text>

  <!-- Primary graph edges -->
  <path d="M 430 350 C 520 295, 635 295, 720 350" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 970 350 C 1060 295, 1175 295, 1260 350" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1510 425 C 1570 495, 1570 555, 1510 625" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1260 700 C 1160 765, 1055 765, 970 700" fill="none" stroke="#16826a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 1260 700 C 1140 900, 1030 1010, 840 1030" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 720 700 C 610 815, 485 900, 350 970" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 590 1030 C 705 1090, 820 1090, 930 1030" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Architecture rework loop -->
  <path d="M 720 490 C 620 560, 500 560, 405 490" fill="none" stroke="#c2415d" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- Code review failure routing -->
  <path d="M 1260 625 C 1130 520, 1050 520, 970 625" fill="none" stroke="#c2415d" stroke-width="4" marker-end="url(#arrow-red)"/>
  <path d="M 1400 700 C 1320 850, 1190 930, 1040 975" fill="none" stroke="#c2415d" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- API/E2E local fix loop -->
  <path d="M 1510 775 C 1690 860, 1710 1000, 1530 1040" fill="none" stroke="#c2415d" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- Blocked external route -->
  <path d="M 1580 700 C 1740 690, 1805 660, 1840 590" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>

  <!-- Explicit user completion -->
  <path d="M 1760 1050 C 1680 1150, 1420 1180, 1110 1080" fill="none" stroke="#16826a" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow-green)"/>

  <!-- Edge labels -->
  <rect x="520" y="265" width="180" height="34" rx="17" fill="#ffffff"/>
  <text x="610" y="288" class="edge-label">package ready</text>

  <rect x="1040" y="265" width="145" height="34" rx="17" fill="#ffffff"/>
  <text x="1112" y="288" class="edge-label">design pass</text>

  <rect x="1575" y="493" width="115" height="34" rx="17" fill="#ffffff"/>
  <text x="1632" y="516" class="edge-label">source pass</text>

  <rect x="1050" y="780" width="110" height="34" rx="17" fill="#ecfdf5"/>
  <text x="1105" y="803" class="edge-label-green">API/E2E pass</text>

  <rect x="1055" y="900" width="170" height="34" rx="17" fill="#ffffff"/>
  <text x="1140" y="923" class="edge-label">test review pass</text>

  <rect x="505" y="815" width="205" height="34" rx="17" fill="#ffffff"/>
  <text x="607" y="838" class="edge-label">implementation local fix</text>

  <rect x="650" y="1090" width="175" height="34" rx="17" fill="#ffffff"/>
  <text x="737" y="1113" class="edge-label">execution handoff</text>

  <rect x="490" y="518" width="230" height="34" rx="17" fill="#fff1f2"/>
  <text x="605" y="541" class="edge-label-red">gap / impact / unclear</text>

  <rect x="1000" y="485" width="190" height="34" rx="17" fill="#fff1f2"/>
  <text x="1095" y="508" class="edge-label-red">failure-origin review</text>

  <rect x="1260" y="835" width="215" height="34" rx="17" fill="#fff1f2"/>
  <text x="1367" y="858" class="edge-label-red">owner-classified rework</text>

  <rect x="1635" y="840" width="210" height="34" rx="17" fill="#fff1f2"/>
  <text x="1740" y="863" class="edge-label-red">test / env / execution fix</text>

  <rect x="1680" y="615" width="145" height="34" rx="17" fill="#f1f5f9"/>
  <text x="1752" y="638" class="edge-label">blocked</text>

  <rect x="1415" y="1148" width="245" height="34" rx="17" fill="#ecfdf5"/>
  <text x="1537" y="1171" class="edge-label-green">explicit completion / verification</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="400" r="130" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <circle cx="845" cy="400" r="130" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
    <circle cx="1390" cy="400" r="130" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
    <circle cx="1390" cy="700" r="130" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/>
    <circle cx="850" cy="1030" r="130" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <circle cx="1710" cy="1030" r="130" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
    <circle cx="1880" cy="470" r="80" fill="#f1f5f9" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- Node labels -->
  <text x="300" y="375" class="node-title">solution</text>
  <text x="300" y="403" class="node-title">designer</text>
  <text x="300" y="438" class="node-subtitle">entry / scope / requirements</text>

  <text x="845" y="375" class="node-title">architecture</text>
  <text x="845" y="403" class="node-title">reviewer</text>
  <text x="845" y="438" class="node-subtitle">design readiness gate</text>

  <text x="1390" y="375" class="node-title">implementation</text>
  <text x="1390" y="403" class="node-title">engineer</text>
  <text x="1390" y="438" class="node-subtitle">code / local checks</text>

  <text x="1390" y="675" class="node-title">code</text>
  <text x="1390" y="703" class="node-title">reviewer</text>
  <text x="1390" y="738" class="node-subtitle">source / test / failure review</text>

  <text x="850" y="1005" class="node-title">API / E2E</text>
  <text x="850" y="1033" class="node-title">engineer</text>
  <text x="850" y="1068" class="node-subtitle">coverage / execution / evidence</text>

  <text x="1710" y="1005" class="node-title">delivery</text>
  <text x="1710" y="1033" class="node-title">engineer</text>
  <text x="1710" y="1068" class="node-subtitle">docs / release / final handoff</text>

  <text x="1880" y="465" class="node-title">user /</text>
  <text x="1880" y="493" class="node-title">dependency</text>

  <!-- Legend -->
  <line x1="100" y1="1210" x2="170" y2="1210" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="185" y="1216" class="legend">normal handoff</text>
  <line x1="390" y1="1210" x2="460" y2="1210" stroke="#c2415d" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="475" y="1216" class="legend">rework / failure route</text>
  <line x1="760" y1="1210" x2="830" y2="1210" stroke="#16826a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="845" y="1216" class="legend">successful gate</text>
  <line x1="1070" y1="1210" x2="1140" y2="1210" stroke="#64748b" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <text x="1155" y="1216" class="legend">external / user-controlled transition</text>
  <text x="1850" y="1216" class="small" text-anchor="end">G = (V, E), with guarded edges</text>
</svg>
