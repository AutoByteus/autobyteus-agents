id: K7-01.2
titel: Teilchenmodell und Aggregatzustände
kurz: Stoffe bestehen aus Teilchen; ihr Abstand und ihre Ordnung bestimmen den Aggregatzustand.
begriffe:
  - begriff: Teilchenmodell
    stufe: A
    erklaerung: Vorstellung, dass alle Stoffe aus winzigen Teilchen bestehen, die sich bewegen.
  - begriff: Aggregatzustand
    stufe: A
    erklaerung: fest, flüssig oder gasförmig.

lehrplan:
  zitat: "Beispieltext: Aggregatzustände mit dem Teilchenmodell erklären."
  seite: 5
  ebene: Übertragen
  art: { experiment: false, modell: true, rechnen: false, erkenntnisgewinnung: true, anwendung: false }
lernziele:
  - id: Z1
    afb: II
    text: Die Schülerinnen und Schüler können die drei Aggregatzustände mit Abstand und Ordnung der Teilchen erklären.
  - id: Z2
    afb: II
    text: Die Schülerinnen und Schüler können begründen, dass Teilchen beim Verdampfen nicht größer werden.
erfolgskriterien:
  - ziel: Z1
    text: beschreibt zu jedem Zustand Abstand und Ordnung
  - ziel: Z2
    text: wählt in der Abstimmung die richtige Antwort und begründet sie
sachanalyse: |
  Im Teilchenmodell sind Teilchen kleine Kugeln in ständiger Bewegung. Fest: dicht, geordnet, schwingen am Platz.
  Flüssig: dicht, ungeordnet, gegeneinander verschiebbar. Gasförmig: große Abstände, schnelle freie Bewegung.
  Die Teilchen selbst ändern beim Zustandswechsel weder Größe noch Form noch Anzahl.
  Grenzen des Modells: Größenverhältnisse, Kräfte zwischen den Teilchen und die Bewegung werden vereinfacht.
didaktik: |
  Schritt-Animation zeigt die drei Zustände nacheinander; die Klasse beschreibt jeden Schritt.
  Alternative: Schülerinnen und Schüler spielen die Teilchen (stehen dicht – laufen umher).
lehrerskript: |
  „Wir können Teilchen nicht sehen. Deshalb benutzen wir ein Modell: Kugeln. Schaut, wie sie im Eis liegen …“
fehlvorstellungen:
  - vorstellung: Beim Verdampfen werden die Teilchen größer.
    warum: Nur der Abstand wächst; das Teilchen bleibt gleich.
    diagnose: Abstimmung K7-01.2-DI1
    korrektur: Animation erneut zeigen, Teilchengröße vergleichen.
    folie: K7-01.2-ER1
    verstanden: erklärt mit dem Abstand, nicht mit der Teilchengröße
aufgaben:
  - afb: II
    aufgabe: Zeichne Wasser als Eis, als Flüssigkeit und als Dampf im Teilchenmodell.
    loesung: Eis geordnet und dicht; Wasser dicht, ungeordnet; Dampf wenige Teilchen mit großen Abständen; alle Teilchen gleich groß.
verknuepfungen:
  - rel: vorwissen
    ref: K7-01.1
    text: Schmelztemperatur als Stoffeigenschaft
  - rel: spaeter
    ref: K8-LB1
    text: Bei chemischen Reaktionen gruppieren sich Teilchen um.

folien:
  - id: K7-01.2-ER1
    titel: Fest, flüssig, gasförmig im Teilchenmodell
    zweck: Schritt-Animation der drei Aggregatzustände
    ziele: [Z1]
    einsatz: neu
    niveau: II
    min: 5
    frage: Wie liegen die Teilchen?
    layout: voll
    bausteine:
      - art: schritte
        svg: aggregatzustaende.svg
        alt: Teilchen im festen, flüssigen und gasförmigen Zustand
        schritte:
          - text: Im Eis liegen die Teilchen dicht und geordnet.
            zeigen: fest
          - text: Im Wasser sind sie dicht, aber ungeordnet.
            zeigen: fluessig
            verbergen: fest
          - text: Im Dampf sind sie weit voneinander entfernt.
            zeigen: gas
            verbergen: fluessig
    notizen: |
      Mit → durch die Schritte. Bei jedem Schritt fragen: „Was ändert sich – und was bleibt gleich?“ (Teilchengröße bleibt!)
      Gas-Bild ist ein Ausschnitt; im gleichen Gefäß wären es gleich viele Teilchen wie vorher.

  - id: K7-01.2-EN1
    titel: Eis, Wasser, Dampf im Glas
    zweck: Drei Zustände im Alltagsbild finden
    ziele: [Z1]
    einsatz: neu
    niveau: I
    min: 3
    frage: Wo siehst du welchen Zustand?
    bausteine:
      - art: hotspot
        datei: wasser.png
        alt: Glas mit Eiswürfel in heißem Wasser, darüber Nebel
        punkte:
          - x: 47
            y: 47
            titel: Eis – fest
          - x: 55
            y: 70
            titel: Wasser – flüssig
          - x: 50
            y: 18
            titel: Nebel – flüssig!
            text: Wasserdampf ist unsichtbar. Der Nebel sind winzige Tröpfchen.
    notizen: |
      Falle: Der sichtbare „Dampf“ ist Nebel aus Tröpfchen. Echter Wasserdampf ist unsichtbar.

  - id: K7-01.2-UE1
    titel: Ordne nach dem Teilchenabstand
    zweck: Reihenfolge vom kleinsten zum größten Abstand
    ziele: [Z1]
    einsatz: wdh
    niveau: I
    min: 2
    frage: Ordne vom kleinsten zum größten Abstand.
    bausteine:
      - art: reihenfolge
        elemente: [Eis, flüssiges Wasser, Wasserdampf]
        aufloesung: Im Eis liegen die Teilchen am dichtesten, im Dampf am weitesten auseinander.
    notizen: |
      Kurze Wiederholung am Stundenbeginn.

  - id: K7-01.2-DI1
    titel: Abstimmung – werden Teilchen größer?
    zweck: Fehlvorstellung zur Teilchengröße aufdecken
    ziele: [Z2]
    einsatz: neu
    niveau: II
    min: 3
    frage: Werden die Teilchen größer, wenn Wasser verdampft?
    bausteine:
      - art: abstimmung
        optionen:
          - text: Ja, sie dehnen sich aus.
          - text: Nein, nur der Abstand wird größer.
            richtig: true
          - text: Die Teilchen verschwinden.
        aufloesung: Die Teilchen bleiben gleich groß. Nur ihr Abstand wächst.
    notizen: |
      Hände zählen, mit + eintragen, dann „Auflösen“. Häufigste Fehlvorstellung: Teilchen dehnen sich aus.

  - id: K7-01.2-VT1
    titel: Wasser aus Wasserstoff und Sauerstoff
    zweck: Ausblick auf die chemische Reaktion mit Reaktionsgleichung
    ziele: [Z1]
    einsatz: neu
    niveau: III
    min: 3
    frage: Woraus entsteht Wasser?
    bausteine:
      - art: gleichung
        wort: Wasserstoff + Sauerstoff → Wasser
        formel: 2 H2 + O2 -> 2 H2O
      - art: text
        text: Aus zwei Stoffen entsteht ein neuer Stoff mit neuen Eigenschaften.
    notizen: |
      Nur als Ausblick für schnelle Lernende; die Reaktionsgleichung kommt in Klasse 8 ausführlich.

  - id: K7-01.2-EN2
    titel: Teilchenbewegung und Temperatur
    zweck: Regler zeigt, dass Teilchen sich bei höherer Temperatur schneller bewegen
    ziele: [Z1]
    einsatz: neu
    niveau: I
    min: 3
    frage: Was ändert sich, wenn es wärmer wird?
    layout: voll
    bausteine:
